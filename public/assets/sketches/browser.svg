<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 160" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Browser frame -->
  <rect x="10" y="10" width="200" height="140" rx="6" />
  <!-- Title bar -->
  <line x1="10" y1="38" x2="210" y2="38" />
  <!-- Traffic lights -->
  <circle cx="28" cy="24" r="5" />
  <circle cx="44" cy="24" r="5" />
  <circle cx="60" cy="24" r="5" />
  <!-- Address bar -->
  <rect x="75" y="17" width="100" height="14" rx="7" />
  <!-- URL text hint -->
  <line x1="83" y1="24" x2="145" y2="24" />
  <!-- Content area - hero block -->
  <rect x="20" y="48" width="180" height="60" rx="2" />
  <!-- Content lines -->
  <line x1="20" y1="120" x2="120" y2="120" />
  <line x1="20" y1="130" x2="140" y2="130" />
  <line x1="20" y1="140" x2="100" y2="140" />
  <!-- Nav items -->
  <line x1="130" y1="24" x2="148" y2="24" />
  <line x1="155" y1="24" x2="173" y2="24" />
</svg>
