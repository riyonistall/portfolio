<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
  <!-- Outer frame -->
  <rect x="10" y="10" width="160" height="160" rx="2" />
  <!-- Vertical lines -->
  <line x1="50" y1="10" x2="50" y2="170" />
  <line x1="90" y1="10" x2="90" y2="170" />
  <line x1="130" y1="10" x2="130" y2="170" />
  <!-- Horizontal lines -->
  <line x1="10" y1="50" x2="170" y2="50" />
  <line x1="10" y1="90" x2="170" y2="90" />
  <line x1="10" y1="130" x2="170" y2="130" />
  <!-- Filled cells hints -->
  <rect x="11" y="11" width="38" height="38" rx="1" fill="none" stroke-dasharray="3 2" />
  <rect x="51" y="91" width="38" height="38" rx="1" fill="none" stroke-dasharray="3 2" />
  <rect x="131" y="51" width="38" height="38" rx="1" fill="none" stroke-dasharray="3 2" />
  <!-- Typography marker -->
  <line x1="20" y1="65" x2="40" y2="65" />
  <line x1="30" y1="60" x2="30" y2="70" />
</svg>
