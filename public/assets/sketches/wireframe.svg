<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Outer frame -->
  <rect x="10" y="10" width="180" height="140" rx="3" />
  <!-- Header area -->
  <rect x="10" y="10" width="180" height="25" rx="3" />
  <!-- Nav items in header -->
  <line x1="20" y1="22" x2="50" y2="22" />
  <line x1="80" y1="22" x2="100" y2="22" />
  <line x1="110" y1="22" x2="130" y2="22" />
  <line x1="140" y1="22" x2="160" y2="22" />
  <!-- Hero image placeholder -->
  <rect x="20" y="45" width="100" height="65" rx="2" />
  <line x1="20" y1="45" x2="120" y2="110" />
  <line x1="120" y1="45" x2="20" y2="110" />
  <!-- Sidebar -->
  <rect x="130" y="45" width="50" height="65" rx="2" />
  <line x1="135" y1="55" x2="175" y2="55" />
  <line x1="135" y1="65" x2="170" y2="65" />
  <line x1="135" y1="75" x2="175" y2="75" />
  <line x1="135" y1="85" x2="165" y2="85" />
  <line x1="135" y1="95" x2="170" y2="95" />
  <!-- Footer content -->
  <line x1="20" y1="125" x2="180" y2="125" />
  <line x1="20" y1="135" x2="140" y2="135" />
  <line x1="20" y1="145" x2="120" y2="145" />
</svg>
