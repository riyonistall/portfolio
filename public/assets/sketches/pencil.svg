<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 200" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Pencil body -->
  <path d="M15 20 L45 20 L45 155 L30 180 L15 155 Z" />
  <!-- Pencil top eraser band -->
  <line x1="15" y1="30" x2="45" y2="30" />
  <!-- Eraser top cap -->
  <rect x="15" y="20" width="30" height="10" rx="2" />
  <!-- Eraser fill area -->
  <rect x="17" y="22" width="26" height="6" rx="1" />
  <!-- Wood/sharpened area -->
  <line x1="15" y1="145" x2="45" y2="145" />
  <!-- Center line -->
  <line x1="30" y1="30" x2="30" y2="145" />
  <!-- Body stripes -->
  <line x1="15" y1="60" x2="45" y2="60" />
  <line x1="15" y1="90" x2="45" y2="90" />
  <line x1="15" y1="120" x2="45" y2="120" />
  <!-- Tip point -->
  <line x1="28" y1="170" x2="30" y2="180" />
  <line x1="32" y1="170" x2="30" y2="180" />
</svg>
